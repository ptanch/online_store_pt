<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Карточка товара</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <!-- Контейнер -->
  <div class="container py-5">

    <!-- Карточка товара -->
    <div class="row align-items-center bg-white shadow rounded p-4">

      <!-- Фото товара -->
      <div class="col-md-5 text-center">
        <img src="your-image.jpg" class="img-fluid rounded" alt="Фото товара">
      </div>

      <!-- Информация о товаре -->
      <div class="col-md-7 mt-4 mt-md-0">
        <h2 class="fw-bold mb-3">iPhone 17 Pro</h2>
        <p class="text-muted mb-2">Категория: Смартфоны</p>
        <p class="text-secondary">
          Новый iPhone 17 Pro с потрясающим экраном, увеличенным временем работы батареи и мощным процессором.
        </p>

        <h4 class="text-primary mb-3">189 000 ₽</h4>

        <button class="btn btn-primary btn-lg me-2">Купить</button>
        <button class="btn btn-outline-secondary btn-lg">Добавить в корзину</button>
      </div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
