{% extends 'catalog/base.html' %}

{% block title %}Удалить товар{% endblock %}

{% block content %}
<div class="container mt-4">
    <h2>Удалить товар "{{ object.name }}"?</h2>
    <p>Вы уверены, что хотите безвозвратно удалить этот товар?</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Да, удалить</button>
        <a href="{% url 'product_detail' object.pk %}" class="btn btn-secondary">Отмена</a>
    </form>
</div>
{% endblock %}
