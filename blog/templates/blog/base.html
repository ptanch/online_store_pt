<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Блог{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">

<header class="bg-dark text-white py-3 mb-4">
    <div class="container d-flex justify-content-between align-items-center">
        <h1 class="h3 mb-0">
            <a href="{% url 'blog:blog_list' %}" class="text-white text-decoration-none">Мой Блог</a>
        </h1>
        <a href="{% url 'blog:blog_create' %}" class="btn btn-outline-light">Создать статью</a>
    </div>
</header>

<main class="container mb-5">
    {% block content %}{% endblock %}
</main>

<footer class="bg-light py-3 mt-auto border-top">
    <div class="container text-center text-muted">
        © {% now "Y" %} Мой блог. Все права защищены.
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
