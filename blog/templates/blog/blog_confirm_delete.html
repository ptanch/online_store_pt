{% extends 'blog/base.html' %}

{% block title %}Удалить статью{% endblock %}

{% block content %}
<h2>Удалить статью "{{ object.title }}"?</h2>
<p>Вы уверены, что хотите безвозвратно удалить эту статью?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Да, удалить</button>
    <a href="{% url 'blog:blog_detail' object.pk %}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
